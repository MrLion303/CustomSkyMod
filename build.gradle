plugins { id 'base' }

def legacyDir = file('legacy/classes')
def toolsSource = file('tools/renamer/src/main/java')

subprojects {
    repositories { mavenCentral() }
    sourceSets {
        renamer { java.srcDir toolsSource }
    }
    dependencies {
        renamerImplementation 'org.ow2.asm:asm:9.7'
        renamerImplementation 'org.ow2.asm:asm-commons:9.7'
    }
    tasks.register('renameLegacy', JavaExec) {
        dependsOn tasks.named('renamerClasses')
        classpath = sourceSets.renamer.runtimeClasspath
        mainClass = 'ClassRenamer'
        def outDir = file("$buildDir/renamed")
        args legacyDir, outDir, project.name == 'fabric'
        doFirst { delete(outDir); outDir.mkdirs() }
    }
}
