name: Inspect legacy classes

on:
  push:
    branches: [port-1.20.1-multiloader]

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download CFR
        run: curl -L --fail -o cfr.jar https://www.benf.org/other/cfr/cfr-0.152.jar
      - name: Decompile
        run: |
          mkdir -p decompiled
          java -jar cfr.jar CustomSkyMod --outputdir decompiled --silent true
      - name: Archive sources
        run: |
          zip -r decompiled-sources.zip decompiled
      - uses: actions/upload-artifact@v4
        with:
          name: decompiled-sources
          path: decompiled-sources.zip
