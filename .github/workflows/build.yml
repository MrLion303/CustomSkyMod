name: Build CustomSkyMod

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build Forge and Fabric
        run: gradle :forge:jar :fabric:jar --no-daemon
      - name: Upload Forge JAR
        uses: actions/upload-artifact@v4
        with:
          name: CustomSkyMod-1.20.1-forge
          path: forge/build/libs/CustomSkyMod-1.20.1-forge.jar
      - name: Upload Fabric JAR
        uses: actions/upload-artifact@v4
        with:
          name: CustomSkyMod-1.20.1-fabric
          path: fabric/build/libs/CustomSkyMod-1.20.1-fabric.jar
